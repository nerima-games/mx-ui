<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>mx-ui browser harness</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        font-family: system-ui, sans-serif;
      }

      [data-harness-page] {
        --harness-safe-inset: env(safe-area-inset-top, 0px);
        position: fixed;
        inset: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(20rem, 24rem);
        overflow: hidden;
      }

      [data-harness-page][data-panel-hidden='true'] {
        grid-template-columns: minmax(0, 1fr);
      }

      [data-harness-stage] {
        position: relative;
        min-width: 0;
        overflow: auto;
        background: rgb(128, 128, 128);
      }

      [data-harness-stage][data-background='white'] {
        background: white;
      }

      [data-harness-stage][data-background='black'] {
        background: black;
      }

      [data-harness-stage][data-background='checker'] {
        background-color: #aaa;
        background-image: conic-gradient(#eee 25%, #888 0 50%, #eee 0 75%, #888 0);
        background-size: 24px 24px;
      }

      [data-harness-viewport] {
        position: relative;
        overflow: hidden;
        background: transparent;
      }

      [data-harness-host] {
        position: absolute;
        inset: 0;
        padding: var(--harness-safe-inset);
        box-sizing: border-box;
        font-size: calc(1rem * var(--harness-text-scale, 1));
      }

      [data-harness-host][hidden] {
        display: none;
      }

      [data-harness-gallery] {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(20rem, 1fr));
        align-items: start;
        gap: 1rem;
        padding: 1rem;
      }

      [data-scenario-card] {
        min-width: 0;
        overflow: hidden;
        border: 1px solid #666;
        background: rgba(255, 255, 255, 0.72);
      }

      [data-scenario-card] h2 {
        margin: 0;
        padding: 0.5rem;
        font-size: 1rem;
      }

      [data-debug-panel] {
        min-width: 0;
        overflow: auto;
        padding: 1rem;
        border-left: 1px solid #888;
        background: #f7f7f7;
        color: #171717;
        font: 14px/1.4 system-ui, sans-serif;
      }

      [data-debug-panel][hidden] {
        display: none;
      }

      [data-debug-panel] h1 {
        margin: 0 0 1rem;
        font-size: 1.25rem;
      }

      [data-debug-panel] h2 {
        margin: 0 0 0.5rem;
        font-size: 1rem;
      }

      [data-debug-panel] section {
        display: grid;
        gap: 0.5rem;
        margin: 0 0 1rem;
        padding-bottom: 0.75rem;
        border-bottom: 1px solid #ccc;
      }

      [data-debug-panel] label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
      }

      [data-debug-panel] select,
      [data-debug-panel] input,
      [data-debug-panel] button {
        max-width: 100%;
        font: inherit;
      }

      [data-debug-panel] button {
        padding: 0.25rem 0.5rem;
      }

      [data-scenario-buttons],
      [data-timeline-controls] {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
      }

      [data-testid='time-slider'] {
        width: 100%;
      }

      [data-testid='state-json'] {
        max-height: 12rem;
        overflow: auto;
        margin: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      [role='alert'] {
        color: #a40000;
        font-weight: 700;
      }
    </style>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
